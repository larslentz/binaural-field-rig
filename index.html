<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Binaural field rig</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.bn-stage{touch-action:pan-y;position:relative}
.bn-stage:focus{outline:none}
.bn-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.bn-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.bn-label{fill:var(--anatomy-shade-2);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.bn-screw{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.3px;vector-effect:non-scaling-stroke}

/* recorder face, drawn in the plane of the face */
.bn-face{fill:none;stroke:var(--anatomy-faint);stroke-width:.4px;vector-effect:non-scaling-stroke}
.bn-grillebox{fill:var(--anatomy-shade-1);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.bn-hole{fill:var(--anatomy-lo)}
.bn-bezel{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.bn-screen{fill:var(--anatomy-paper);stroke:var(--anatomy-mid);stroke-width:.4px;vector-effect:non-scaling-stroke}
.bn-meterbg{fill:var(--anatomy-shade-0)}
.bn-meter{fill:var(--anatomy-hi)}
.bn-hold{fill:var(--anatomy-lit)}
.bn-icon{fill:none;stroke:var(--anatomy-mid);stroke-width:.35px;vector-effect:non-scaling-stroke}
.bn-icon[data-on]{fill:var(--anatomy-hi);stroke:var(--anatomy-hi)}
.bn-rec{fill:var(--anatomy-mid)}
.bn-led{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.3px;vector-effect:non-scaling-stroke;transition:fill .25s var(--anatomy-ease)}
.bn-led[data-on]{fill:var(--anatomy-lit);stroke:var(--anatomy-lit)}
.bn-led-rec{fill:var(--anatomy-hi)}

/* ears */
.bn-canal{fill:var(--anatomy-lo);transition:fill .5s var(--anatomy-ease)}
.bn-canal[data-hit]{fill:var(--anatomy-lit);transition:none}
.bn-fur{transition:opacity .4s var(--anatomy-ease)}
.bn-stage[data-fur="off"] .bn-fur{opacity:0}

/* signal flash on the cables */
.it[data-sig] .tb-body,.it[data-sig] .tb-shine,.it[data-sig] .tb-shade{transition:fill .9s var(--anatomy-ease)}
.it[data-hot] .tb-body,.it[data-hot] .tb-shine,.it[data-hot] .tb-shade{fill:var(--anatomy-lit);transition:none}
.it[data-hot] .iso-edge{stroke:var(--anatomy-lit)}

/* wavefronts */
.bn-ring{fill:none;stroke:var(--anatomy-lit);stroke-width:.9px;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
.bn-ray{fill:none;stroke:var(--anatomy-mid);stroke-width:.5px;stroke-dasharray:1.5 2.5;vector-effect:non-scaling-stroke;pointer-events:none}
.bn-src{cursor:pointer}
.bn-hit{fill:transparent;stroke:none;cursor:pointer}
.bn-mark{fill:none;stroke:var(--anatomy-lit);stroke-width:.6px;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .3s var(--anatomy-ease)}
.bn-mark[data-on]{opacity:.9}
.bn-stage[data-power="off"] .bn-meter{opacity:0}
.bn-concha{fill:var(--anatomy-shade-1);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}

.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

// live behaviour: wavefronts from the selected source, ear arrival order, cable flash, recorder meters
const D = {"P":{"origin":[310,349.56070067322685],"scale":1.8794795411760326,"azimuth":45,"elevation":30},"head":[-10,-10,76],"headR":8.75,"earZ":76,"ears":{"left":[325.99,186.74],"right":[294.01,168.9]},"sources":[{"id":"bird","name":"songbird","at":[76.5,-54.9,101.6],"f":4000,"period":2.6,"az":117.43270431626085,"el":14.717657878722955,"itd":0.0004903681509520041,"ild":15.091861207637933,"dist":1.0076517255480686,"arrive":0.0029868737418427454,"side":"left","samples":23.537671245696195,"lateral":59.14092730460831},{"id":"chime","name":"wind chime","at":[-55.63603896932107,23.63603896932107,104],"f":1500,"period":3,"az":-53.607931826308196,"el":26.284449882259672,"itd":0.0003963305607870558,"ild":-6.827859393110223,"dist":0.6322998632259125,"arrive":0.001874258546436781,"side":"right","samples":19.02386691777868,"lateral":46.19888669791397},{"id":"cricket","name":"cricket","at":[50,30,0.62],"f":4800,"period":2.2,"az":56.309932474020215,"el":-46.26968932976857,"itd":0.0003081214409707423,"ild":12.62864163336472,"dist":1.0431751722505669,"arrive":0.00309217207804887,"side":"left","samples":14.78982916659563,"lateral":35.11133255712137}],"speed":337.36,"slow":1000,"view":[0.6123724356957946,0.6123724356957945,0.49999999999999994],"plate":{"x":-80,"y":-60,"w":160,"d":120,"r":6}};
const stage = document.querySelector(".bn-stage");
const svg = stage.querySelector("svg");
const NS = "http://www.w3.org/2000/svg";
const backLayer = svg.querySelector('[data-part="rings-back"]');
const frontLayer = svg.querySelector('[data-part="rings-front"]');
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const meters = { L: svg.querySelector('[data-meter="L"]'), R: svg.querySelector('[data-meter="R"]') };
const canals = { left: svg.querySelector('[data-ear="left"]'), right: svg.querySelector('[data-ear="right"]') };
const pwrIcon = svg.querySelector('[data-part="pwr"]');
const peakLed = svg.querySelector('[data-part="peak"]');
const micCable = [...svg.querySelectorAll('[data-sig]')];
const still = matchMedia("(prefers-reduced-motion: reduce)");

const C = (D.speed * 100) / D.slow; // cm per second on screen
const METER_W = 3.85;
const NEAR_DBFS = -16; // example level for the near ear
const MAX_R = 150;
const P = D.P;
const headDepth = depthOf(D.head, P);
const CLIP = { x0: D.plate.x + 2.5, y0: D.plate.y + 2.5, x1: D.plate.x + D.plate.w, y1: D.plate.y + D.plate.d };

let sel = 0;
let power = true;
let fur = true;
let lastInput = -1e9;
let rings = [];
let nextEmit = 0;
let level = { L: -60, R: -60 };
let hotUntil = 0;

const el = (name, attrs, parent) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};

// hit targets and markers at the sources
const marks = D.sources.map((s, i) => {
  const [x, y] = iso(s.at, P);
  const g = el("g", { class: "bn-src", "data-src": s.id }, frontLayer);
  const mark = el("circle", { class: "bn-mark", cx: x.toFixed(2), cy: y.toFixed(2), r: 7 }, g);
  el("circle", { class: "bn-hit", cx: x.toFixed(2), cy: y.toFixed(2), r: 13 }, g);
  g.addEventListener("pointerenter", () => choose(i, true));
  g.addEventListener("click", () => choose(i, true));
  return mark;
});
const ray = el("path", { class: "bn-ray" }, frontLayer);
const backPaths = [];
const frontPaths = [];
const pathPool = (layer, pool, i) => pool[i] ?? (pool[i] = el("path", { class: "bn-ring" }, layer));

function fmt(s) {
  const side = s.az >= 0 ? "L" : "R";
  return `${s.name} · ${Math.abs(s.az).toFixed(0)}° ${side} · ITD ${(s.itd * 1e3).toFixed(2)} ms · ILD ${Math.abs(s.ild).toFixed(0)} dB`;
}
function says(s) {
  const side = s.az >= 0 ? "left" : "right";
  const near = s.ild >= 0 ? "left" : "right";
  return `${s.name}, ${Math.abs(s.az).toFixed(0)} degrees to the ${side}. It reaches the ${near} ear ${(s.itd * 1e3).toFixed(2)} milliseconds sooner, ${Math.round(s.samples)} samples at 48 kHz, and ${Math.abs(s.ild).toFixed(0)} dB louder at ${(s.f / 1000).toFixed(1)} kHz.`;
}
function setReadout() {
  const s = D.sources[sel];
  readout.textContent = power ? fmt(s) : "MIC POWER off · no signal";
}
function choose(i, user) {
  if (user) lastInput = performance.now();
  if (i === sel && rings.length) return;
  sel = (i + D.sources.length) % D.sources.length;
  rings = [];
  nextEmit = performance.now() / 1000;
  marks.forEach((m, k) => (k === sel ? m.setAttribute("data-on", "") : m.removeAttribute("data-on")));
  const s = D.sources[sel];
  ray.setAttribute("d", `M${iso(s.at, P).map((v) => v.toFixed(2)).join(" ")}L${iso(D.head, P).map((v) => v.toFixed(2)).join(" ")}`);
  setReadout();
  status.textContent = power ? says(s) : readout.textContent;
  if (still.matches) drawStill();
}
function setPower(on) {
  power = on;
  stage.dataset.power = on ? "on" : "off";
  on ? pwrIcon.setAttribute("data-on", "") : pwrIcon.removeAttribute("data-on");
  setReadout();
  status.textContent = on ? "MIC POWER on: plug-in power biases the ear capsules" : "MIC POWER off: the electret capsules get no bias, so there is no signal";
  if (still.matches) drawStill();
}
function setFur(on) {
  fur = on;
  stage.dataset.fur = on ? "on" : "off";
  status.textContent = on ? "Fur windscreens on" : "Fur windscreens off";
}

// one wavefront: slice of the sphere at ear height, split into the half behind the head and the half in front
function ringPaths(src, R) {
  const dz = D.earZ - src.at[2];
  if (R <= Math.abs(dz)) return null;
  const r = Math.sqrt(R * R - dz * dz);
  const n = Math.max(36, Math.min(120, Math.round(r * 1.2)));
  let back = "";
  let front = "";
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const p = [src.at[0] + Math.cos(a) * r, src.at[1] + Math.sin(a) * r, D.earZ];
    const inside = p[0] > CLIP.x0 && p[0] < CLIP.x1 && p[1] > CLIP.y0 && p[1] < CLIP.y1;
    const isFront = depthOf(p, P) > headDepth;
    const [x, y] = iso(p, P);
    const key = inside ? (isFront ? "f" : "b") : null;
    const seg = `${x.toFixed(1)} ${y.toFixed(1)}`;
    if (key === "f") front += (prev === "f" ? "L" : "M") + seg;
    if (key === "b") back += (prev === "b" ? "L" : "M") + seg;
    prev = key;
  }
  return { back, front };
}
function arrivals(s) {
  const centre = (s.dist * 100) / C;
  const half = (s.itd * D.slow) / 2;
  const near = s.ild >= 0 || s.side === "left" ? s.side : s.side;
  const far = near === "left" ? "right" : "left";
  return [
    { ear: near, t: centre - half, db: NEAR_DBFS },
    { ear: far, t: centre + half, db: NEAR_DBFS - Math.abs(s.ild) },
  ];
}
function hit(ear, db, now) {
  const c = canals[ear];
  c.setAttribute("data-hit", "");
  setTimeout(() => c.removeAttribute("data-hit"), 260);
  if (!power) return;
  const ch = ear === "left" ? "L" : "R";
  level[ch] = Math.max(level[ch], db);
  hotUntil = now + 0.12;
  micCable.forEach((g) => g.setAttribute("data-hot", ""));
}
const widthOf = (db) => Math.max(0, Math.min(1, 1 + db / 48)) * METER_W;

function frame(ms) {
  const now = ms / 1000;
  const s = D.sources[sel];
  if (now >= nextEmit) {
    rings.push({ t0: now, fired: [false, false] });
    nextEmit = now + s.period;
  }
  const arr = arrivals(s);
  let bi = 0;
  let fi = 0;
  rings = rings.filter((ring) => now - ring.t0 < MAX_R / C + 0.5);
  for (const ring of rings) {
    const age = now - ring.t0;
    arr.forEach((a, k) => {
      if (!ring.fired[k] && age >= a.t) {
        ring.fired[k] = true;
        hit(a.ear, a.db, now);
      }
    });
    const R = age * C;
    const paths = ringPaths(s, R);
    if (!paths) continue;
    const o = Math.max(0, 1 - R / MAX_R).toFixed(3);
    const b = pathPool(backLayer, backPaths, bi++);
    b.setAttribute("d", paths.back);
    b.setAttribute("opacity", o);
    const f = pathPool(frontLayer, frontPaths, fi++);
    f.setAttribute("d", paths.front);
    f.setAttribute("opacity", o);
  }
  for (let i = bi; i < backPaths.length; i++) backPaths[i].setAttribute("d", "");
  for (let i = fi; i < frontPaths.length; i++) frontPaths[i].setAttribute("d", "");
  if (now > hotUntil) micCable.forEach((g) => g.removeAttribute("data-hot"));
  for (const ch of ["L", "R"]) {
    level[ch] = Math.max(-60, level[ch] - 18 / 60);
    meters[ch].setAttribute("width", (power ? widthOf(level[ch]) : 0).toFixed(3));
  }
  // idle tour: move to the next source every three wavefronts once the reader has left it alone
  if (ms - lastInput > 20000 && rings.length && now - rings[0].t0 > s.period * 3) choose(sel + 1, false);
  if (!still.matches) requestAnimationFrame(frame);
}

function drawStill() {
  const s = D.sources[sel];
  const R = s.dist * 100;
  const paths = ringPaths(s, R) ?? { back: "", front: "" };
  pathPool(backLayer, backPaths, 0).setAttribute("d", paths.back);
  pathPool(frontLayer, frontPaths, 0).setAttribute("d", paths.front);
  backPaths[0].setAttribute("opacity", "0.8");
  frontPaths[0].setAttribute("opacity", "0.8");
  for (const a of arrivals(s)) {
    const ch = a.ear === "left" ? "L" : "R";
    meters[ch].setAttribute("width", (power ? widthOf(a.db) : 0).toFixed(3));
  }
  canals[arrivals(s)[0].ear].setAttribute("data-hit", "");
  canals[arrivals(s)[1].ear].removeAttribute("data-hit");
}

stage.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k >= "1" && k <= "3") choose(+k - 1, true);
  else if (k === "ArrowRight" || k === "ArrowDown") choose(sel + 1, true);
  else if (k === "ArrowLeft" || k === "ArrowUp") choose(sel - 1, true);
  else if (k === "p" || k === "P") setPower(!power), (lastInput = performance.now());
  else if (k === "f" || k === "F") setFur(!fur), (lastInput = performance.now());
  else return;
  e.preventDefault();
});
stage.addEventListener("pointerdown", () => stage.focus({ preventScroll: true }));

const params = new URLSearchParams(location.search);
setFur(params.get("fur") === "on");
setPower(params.get("power") !== "off");
choose(Math.max(0, Math.min(2, +(params.get("src") ?? 1) - 1)), false);
status.textContent = "";
if (still.matches) drawStill();
else requestAnimationFrame(frame);
still.addEventListener?.("change", () => (still.matches ? drawStill() : requestAnimationFrame(frame)));
</script></body></html>
